name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/github-files-creation-606838]
  workflow_dispatch:

# Pages needs these; the token stays read-only for repo contents.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Supabase values are published to the browser by design (VITE_ prefix).
      # Set them as repository *variables* (Settings -> Secrets and variables ->
      # Actions -> Variables). They end up in the bundle either way, so they are
      # variables rather than secrets. No Anthropic key here — that is supplied
      # per-device at runtime and must never enter the build.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # index.html doubles as the 404 page so a refresh on any path still loads.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
